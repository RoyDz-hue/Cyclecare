[package]
name = "cyclecare-core-jni"
version = "0.1.0"
edition = "2021"
description = "JNI bridge surface for cyclecare-core. Loaded by the existing Kotlin host (CycleCareCoreBridge.kt). Transitional: host stays Kotlin until the Rust-authored screen feasibility is proven."

[lib]
crate-type = ["cdylib"]

[dependencies]
cyclecare-core = { path = "../core" }
jni = "0.21"
