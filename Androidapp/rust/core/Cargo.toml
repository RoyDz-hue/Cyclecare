[package]
name = "cyclecare-core"
version = "0.1.0"
edition = "2021"
description = "Framework-neutral CycleCare domain/state contracts (identity, startup, wallet). No UI, no I/O, no auth backend."
license = "UNLICENSED"

[dependencies]
sha2 = "0.10"
regex = "1"
unicode-general-category = "1"
bigdecimal = "0.4"
num-bigint = "0.4"
serde_json = "1"
ryu = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
