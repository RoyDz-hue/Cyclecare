[package]
name = "cyclecare-core"
version = "0.1.0"
edition = "2021"
description = "Framework-neutral CycleCare domain/state contracts (identity, startup, wallet). No UI, no I/O, no auth backend."
license = "UNLICENSED"

[dependencies]
aes-gcm = "0.11"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
regex = "1"
unicode-general-category = "1"
bigdecimal = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"
ryu = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.32", optional = true }
# Optional secure browser entropy (crypto.getRandomValues) for wasm32 via
# getrandom's js backend; only enabled by `web-secure-entropy`.
getrandom = { version = "0.2", optional = true, default-features = false, features = ["js"] }

[features]
default = ["sqlite"]
sqlite = ["rusqlite", "rusqlite/bundled"]
# Host-only encrypted storage rehearsal: compiles storage_db against the
# bundled SQLCipher codec and adds encrypted_host (the DatabaseEncryption.kt
# conversion state machine on real SQLCipher files, synthetic scratch data
# only). Mutually exclusive with `sqlite` (one bundled codec library), never
# part of default/FFI builds, and NOT a production migration switch.
sqlcipher-host = ["rusqlite", "rusqlite/bundled-sqlcipher"]
# HOST-FIXTURE ONLY: lets non-Linux/Android targets (wasm32 browser demo)
# build the care-policy proposal id without OS entropy via a labeled
# deterministic counter. Never for production; real targets use OS entropy
# and unsupported targets fail to compile without this feature.
host-fixture-entropy = []
# SECURE wasm32 entropy: crypto.getRandomValues through getrandom/js. The
# production-shape browser path; mutually exclusive with the fixture counter
# (compile_error enforced in care_policy.rs). Requires a browser/window
# context (not Node without crypto).
web-secure-entropy = ["dep:getrandom"]
# Integration-test-only hooks (failure injection). Not compiled into release
# or FFI builds; enabled solely via the self dev-dependency below.
test-support = []

[dev-dependencies]
cyclecare-core = { path = ".", default-features = false, features = ["test-support"] }
