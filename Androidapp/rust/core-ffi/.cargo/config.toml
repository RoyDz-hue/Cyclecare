# Android 15+ devices may use 16 KB memory pages: every PT_LOAD segment of the
# packaged native library must be 16 KB aligned (minSdk alone does not cover
# this). Applies only to the Android targets; host builds are unaffected.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
