[package]
name = "cyclecare-core-ffi"
version = "0.1.0"
edition = "2021"
description = "Read-only JNI bridge over cyclecare-core pure functions. JSON in, JSON out. No DB, no Keystore, no signing, no account mutation."

[lib]
name = "cyclecare_core"
crate-type = ["cdylib"]

[dependencies]
cyclecare-core = { path = "../core" }
jni = { version = "0.21", default-features = false }  # invocation feature unused (no JVM launch); drops walkdir/winapi-util from the resolve so a fully-offline reviewer build needs no Windows-only crates
serde = { version = "1", features = ["derive"] }
bigdecimal = "0.4"
serde_json = "1"
chrono = { version = "0.4", default-features = false }
