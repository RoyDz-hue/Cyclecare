name: Build slim APK (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build slim arm64 APK (unsigned when no keystore present)
        working-directory: Androidapp
        run: |
          chmod +x gradlew
          ./gradlew assembleSlim -PslimApk --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-slim-unsigned
          path: Androidapp/app/build/outputs/apk/slim/*/
