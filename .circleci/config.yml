# CycleCare CI - for Roy's existing free CircleCI account (30,000 credits/mo, no card).
# Scope: Cyclecare repo only, side branch only, on-demand runs only. No scheduled triggers.
# Place at .circleci/config.yml on the target branch (repo root).
# NOTE: the Android project lives in the Androidapp/ subdirectory of this repo,
# so all gradle/rust paths below are prefixed with Androidapp/.
version: 2.1

jobs:
  # Primary: Kotlin/JVM witness + unit tests (the gating requirement).
  # packageRustCore is tolerant of a missing Rust .so (logs "Kotlin fallback will be used"),
  # so no Rust toolchain is needed for this job.
  unit-tests:
    docker:
      - image: cimg/android:2026.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Ensure SDK platform 36 + build-tools present
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
      - run:
          # Verbatim from the compile-proven Codemagic config (commit df3f4d5):
          # org.robolectric artifacts are routed via the Google-hosted Maven
          # Central mirror because plain Maven Central fetches failed there.
          name: Route org.robolectric via Google-hosted Maven Central mirror
          command: |
            set -e
            mkdir -p "$HOME/.gradle/init.d"
            cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" \<<'GRADLE'
            settingsEvaluated { settings ->
                settings.dependencyResolutionManagement.repositories {
                    exclusiveContent {
                        forRepository {
                            maven {
                                name = 'GoogleCloudStorageMavenCentralMirror'
                                url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                            }
                        }
                        filter { includeGroup('org.robolectric') }
                    }
                }
            }
            GRADLE
      - restore_cache:
          key: cyclecare-gradle-{{ checksum "Androidapp/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "Androidapp/gradle/libs.versions.toml" }}
      - run:
          # Run #4 lost its failure evidence when the default 10-minute
          # no-output window killed the Gradle step: log one line per test
          # event so progress stays visible and every outcome is recorded.
          name: Enable per-test event logging
          command: |
            set -e
            mkdir -p "$HOME/.gradle/init.d"
            cat > "$HOME/.gradle/init.d/cyclecare-test-logging.gradle" \<<'GRADLE'
            allprojects {
                tasks.withType(Test).configureEach {
                    testLogging {
                        events 'PASSED', 'FAILED', 'SKIPPED'
                        exceptionFormat 'full'
                        showStackTraces true
                        showCauses true
                    }
                }
            }
            GRADLE
      - run:
          name: Kotlin unit + witness tests (debug)
          # Generous no-output budget on top of per-test event logging.
          no_output_timeout: 30m
          command: |
            cd Androidapp
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - save_cache:
          key: cyclecare-gradle-{{ checksum "Androidapp/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "Androidapp/gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle
      - store_test_results:
          path: Androidapp/app/build/test-results
      - store_artifacts:
          path: Androidapp/app/build/reports/tests
      # Raw XML kept as artifacts too: run #4's evidence loss showed the
      # test-results UI alone is not enough when a run dies early.
      - store_artifacts:
          path: Androidapp/app/build/test-results

  # OPTIONAL (uncomment when an APK verification run is wanted):
  # Builds the Rust core natively, then assembles a debug APK.
  # assemble-debug:
  #   docker:
  #     - image: cimg/android:2026.10.1-ndk
  #   resource_class: medium
  #   steps:
  #     - checkout
  #     - run:
  #         name: Install pinned Rust toolchain + Android target
  #         command: |
  #           curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
  #           export PATH="$HOME/.cargo/bin:$PATH"
  #           rustup toolchain install 1.99.1
  #           rustup target add --toolchain 1.99.1 aarch64-linux-android
  #     - run:
  #         name: Build Rust core (pinned) + verify artifact
  #         command: |
  #           export PATH="$HOME/.cargo/bin:$PATH"
  #           export ANDROID_NDK_HOME="$ANDROID_NDK"
  #           cd Androidapp
  #           ./rust/build-android.sh aarch64-linux-android 1.99.1
  #           ./rust/verify-android-artifact.sh
  #     - run:
  #         name: Assemble debug APK
  #         command: |
  #           cd Androidapp
  #           ./gradlew assembleDebug --no-daemon --stacktrace
  #     - store_artifacts:
  #         path: Androidapp/app/build/outputs/apk

workflows:
  cyclecare:
    jobs:
      # Branch guard: this workflow can only run on the designated test branch.
      # One push of the config = the single approved test-build attempt; no manual
      # re-dispatch, and no other branch (or future merge) can consume a run.
      - unit-tests:
          filters:
            branches:
              only: ci-20261114/circleci-test-build-2
