workflows:
  cyclecare-slim:
    name: CycleCare slim APK + targeted unit tests
    max_build_duration: 90
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.m2
    scripts:
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Prefetch Robolectric runtime jar (bounded, logged)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          VER="14-robolectric-10818077-i7"
          BASE="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/$VER"
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
          mkdir -p "$DEST"
          for f in "android-all-instrumented-$VER.jar" "android-all-instrumented-$VER.pom"; do
            if [ ! -s "$DEST/$f" ]; then
              echo "fetching $f"
              curl -fsSL --max-time 240 -o "$DEST/$f" "$BASE/$f"
            fi
            ls -la "$DEST/$f"
          done
          echo "prefetch complete"
          } 2>&1 | tee build-logs/robolectric-prefetch.log
      - name: Targeted unit tests
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew testDebugUnitTest \
            --tests "com.cyclecare.bridge.RustCoinAmountTest" \
            --tests "com.cyclecare.bridge.RustReconnectPolicyTest" \
            --tests "com.cyclecare.bridge.RustSetupChecksTest" \
            --tests "com.cyclecare.bridge.RustLogParserTest" \
            --tests "com.cyclecare.bridge.RustCyclePhaseTest" \
            --tests "com.cyclecare.bridge.RustEffectiveUserIdTest" \
            --tests "com.cyclecare.app.domain.ai.AiConsentTapDecisionTest" \
            --tests "com.cyclecare.app.data.notification.NotificationParsingTest" \
            --tests "com.cyclecare.app.domain.parser.NaturalLanguageLogParserTest" \
            --tests "com.cyclecare.app.domain.ai.LayeredChatOrchestratorTest" \
            --tests "com.cyclecare.app.ui.CoinAmountInputTest" \
            --tests "com.cyclecare.app.ui.SettingsPinTest" \
            --tests "com.cyclecare.app.ui.GuidedChatsRoomOpenTest" \
            --tests "com.cyclecare.app.AccountStartPolicyTest" \
            --tests "com.cyclecare.app.ReturningUserReopenTest" \
            --tests "com.cyclecare.app.ReopenSplashGateTest" \
            --tests "com.cyclecare.app.WalletStatusTest" \
            --tests "com.cyclecare.app.domain.ai.CareAiSourceContractTest" \
            2>&1 | tee ../build-logs/test-run.log
      - name: Build unsigned slim APK (arm64, minified)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          mkdir -p ../build-logs
          ./gradlew assembleSlim -PslimApk 2>&1 | tee ../build-logs/assemble-run.log
    artifacts:
      - Androidapp/app/build/outputs/apk/**/*.apk
      - Androidapp/app/build/test-results/testDebugUnitTest/*.xml
      - build-logs/*.log
  cyclecare-goldens:
    name: CycleCare golden refresh (Paparazzi, JDK21)
    max_build_duration: 60
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Record stale goldens after the page-canvas rework
        script: |
          set -e
          cd Androidapp
          chmod +x gradlew
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
          "$JAVA_HOME/bin/java" -version
          for f in "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" "$HOME/.gradle/gradle.properties"; do
            if [ -f "$f" ]; then
              echo "java keys in $f:"
              grep -E '^[[:space:]]*(org\.gradle\.java\.home|org\.gradle\.java\.installations\.[a-z-]+|org\.gradle\.jvm\.version|java\.home)' "$f" || echo "(none)"
            else
              echo "(no $f)"
            fi
          done
          mkdir -p ../build-logs
          set -o pipefail
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" recordPaparazziDebug -Ppaparazzi \
            --tests "com.cyclecare.app.ui.ScreensScreenshotTest" \
            --tests "com.cyclecare.app.ui.ShellFrameScreenshotTest" \
            --tests "com.cyclecare.app.ui.HomeFrameScreenshotTest" \
            --tests "com.cyclecare.app.ui.CompactShellScreenshotTest" \
            --tests "com.cyclecare.app.ui.SettingsScreenshotTest" \
            --tests "com.cyclecare.app.ui.DarkModeContrastScreenshotTest" \
            --tests "com.cyclecare.app.ui.OnboardingContrastScreenshotTest" \
            --tests "com.cyclecare.app.ui.CareConsentScreenshotTest" \
            --tests "com.cyclecare.app.ui.WalletStatusScreenshotTest" 2>&1 | tee ../build-logs/goldens-record.log
      - name: Capture expanded consent details (interactive, Robolectric)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew testDebugUnitTest --tests "com.cyclecare.app.ui.CareConsentExpandedCaptureTest" 2>&1 | tee ../build-logs/consent-capture.log
          cp app/build/test-results/testDebugUnitTest/*.xml ../build-logs/ 2>/dev/null || true
    artifacts:
      - Androidapp/app/src/test/snapshots/images/*.png
      - Androidapp/app/build/outputs/captures/*.png
      - build-logs/*.log
  cyclecare-device-verify:
    name: CycleCare emulator inset verification (real window insets)
    max_build_duration: 35
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $ANDROID_HOME/system-images
    scripts:
      - name: Build debug app and instrumented test APKs
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee ../build-logs/device-verify-build.log
      - name: Inspect installed Android SDK images (bounded)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          echo "== system-images dir =="
          ls -R "$ANDROID_HOME/system-images" 2>/dev/null || echo "(none installed)"
          echo "== sdkmanager installed =="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -i "system-images" || echo "(sdkmanager lists none)"
          } 2>&1 | tee build-logs/sdk-inventory.log
      - name: Ensure a usable system image (bounded 10 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          IMG=$(ls "$ANDROID_HOME/system-images" 2>/dev/null | grep -E '^android-[0-9]+$' | sort -t- -k2 -n | tail -1 || true)
          if [ -n "$IMG" ]; then
            VARIANT=$(ls "$ANDROID_HOME/system-images/$IMG" | grep -E 'google_apis|default' | head -1)
            ABI=$(ls "$ANDROID_HOME/system-images/$IMG/$VARIANT" | grep -E 'arm64|x86_64' | head -1)
            echo "reusing installed image: system-images;$IMG;$VARIANT;$ABI"
            echo "system-images;$IMG;$VARIANT;$ABI" > build-logs/avd-image.txt
          else
            echo "no installed image; installing system-images;android-36;google_apis;arm64-v8a (bounded)"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-36;google_apis;arm64-v8a" < /dev/null &
            IPID=$!
            for i in $(seq 1 120); do kill -0 $IPID 2>/dev/null || break; sleep 5; done
            if kill -0 $IPID 2>/dev/null; then
              kill $IPID 2>/dev/null
              echo "UNSUPPORTED: system image install exceeded 10 minutes on this runner"
              exit 1
            fi
            wait $IPID
            echo "system-images;android-36;google_apis;arm64-v8a" > build-logs/avd-image.txt
          fi
          cat build-logs/avd-image.txt
          } 2>&1 | tee build-logs/ensure-image.log
      - name: Create AVD and boot emulator (bounded 10 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          IMAGE=$(cat build-logs/avd-image.txt)
          echo "using image: $IMAGE"
          AVDMGR="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMU="$ANDROID_HOME/emulator/emulator"
          echo no | "$AVDMGR" create avd -n ccverify -k "$IMAGE" -d pixel_6 --force \
            || echo no | "$AVDMGR" create avd -n ccverify -k "$IMAGE" -d pixel --force
          "$EMU" -avd ccverify -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save > build-logs/emulator-console.log 2>&1 &
          adb wait-for-device
          BOOTED=""
          for i in $(seq 1 110); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOTED" = "1" ] && break
            sleep 5
          done
          echo "boot_completed=$BOOTED"
          [ "$BOOTED" = "1" ]
          adb shell wm size && adb shell wm density
          } 2>&1 | tee build-logs/emulator-step.log
      - name: Run production inset screenshot tests (bounded 8 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          adb install -r Androidapp/app/build/outputs/apk/debug/app-debug.apk
          adb install -r Androidapp/app/build/outputs/androidTest/apk/debug/app-debug-androidTest.apk
          adb shell am instrument -w \
            -e class com.cyclecare.app.DeviceInsetsScreenshotTest \
            com.cyclecare.app.debug.test/androidx.test.runner.AndroidJUnitRunner > build-logs/instrumentation.log 2>&1 &
          JPID=$!
          for i in $(seq 1 96); do kill -0 $JPID 2>/dev/null || break; sleep 5; done
          if kill -0 $JPID 2>/dev/null; then
            kill $JPID 2>/dev/null
            echo "instrumentation exceeded 8 minutes"
            cat build-logs/instrumentation.log || true
            exit 1
          fi
          wait $JPID; RC=$?
          cat build-logs/instrumentation.log
          [ $RC -eq 0 ]
          } 2>&1 | tee build-logs/instrument-step.log
      - name: Collect screenshots
        script: |
          mkdir -p device-verify
          adb pull /sdcard/Android/data/com.cyclecare.app.debug/files/. device-verify/ || true
          ls -la device-verify/ || true
          adb shell emu kill || true
    artifacts:
      - device-verify/*.png
      - build-logs/*.log

  cyclecare-rust-spike:
    name: CycleCare Rust spike S3 data parity + toolchain proof
    max_build_duration: 40
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.m2
        - $HOME/.cargo
        - $HOME/.rustup
        - $CM_BUILD_DIR/spike/rust/target
    environment:
      vars:
        SPIKE_BUDGET_SECONDS: "1380"
    scripts:
      - name: Spike setup, environment and budget clock
        script: |
          set -e
          mkdir -p build-logs/spike spike/out
          date +%s > build-logs/spike/start.ts
          {
          uname -a
          sw_vers
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "budget: $SPIKE_BUDGET_SECONDS seconds, single bounded run, no retries"
          } 2>&1 | tee build-logs/spike/env.log
      - name: Rust toolchain (pinned 1.99.1 + android target)
        script: |
          set -e
          set -o pipefail
          {
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --max-time 120 https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          rustup default 1.99.1
          rustc --version
          cargo --version
          rustup target list --installed
          } 2>&1 | tee build-logs/spike/rust-toolchain.log
      - name: SQLCipher CLI (brew, version recorded)
        script: |
          set -e
          set -o pipefail
          {
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if ! command -v sqlcipher >/dev/null 2>&1; then brew install sqlcipher; fi
          sqlcipher -version
          } 2>&1 | tee build-logs/spike/sqlcipher-cli.log
      - name: Real Room schema dump + AES-GCM vectors phase A (Robolectric/JVM)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests "com.cyclecare.app.SpikeRoomSchemaDumpTest" \
            --tests "com.cyclecare.app.SpikeAesGcmVectorTest" \
            2>&1 | tee ../build-logs/spike/room-dump-and-aes-a.log
          ls -la app/build/spike/
      - name: Fixture assembly from Room authority + transcription diff
        script: |
          set -e
          set -o pipefail
          {
          python3 spike/fixture/assemble_fixture.py
          } 2>&1 | tee build-logs/spike/fixture-assembly.log
      - name: CLI creates fixture DB + cipher introspection
        script: |
          set -e
          set -o pipefail
          {
          PASS=$(openssl rand -base64 32)
          echo "$PASS" > spike/out/fixture-passphrase.txt
          { echo "PRAGMA key = '$PASS';"; cat spike/out/fixture-authoritative.sql; } | sqlcipher spike/out/fixture-cli.db
          echo "=== CLI introspection (CLI-created DB) ==="
          sqlcipher spike/out/fixture-cli.db "PRAGMA key = '$PASS';
          PRAGMA cipher_version;
          PRAGMA kdf_iter;
          PRAGMA cipher_page_size;
          PRAGMA cipher_hmac_algorithm;
          PRAGMA cipher_kdf_algorithm;
          SELECT count(*) FROM cycle_day_logs;
          SELECT identity_hash FROM room_master_table;"
          } 2>&1 | tee build-logs/spike/cli-create.log
      - name: Rust core tests (migration crate) + spike crate host build
        script: |
          set -e
          set -o pipefail
          {
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          cd Androidapp/rust/core && cargo test 2>&1 | tee "$CM_BUILD_DIR/build-logs/spike/core-tests.log"
          cd "$CM_BUILD_DIR/spike/rust"
          cargo build --release 2>&1 | tee "$CM_BUILD_DIR/build-logs/spike/rust-host-build.log"
          grep -A3 '^name = "libsqlite3-sys"' Cargo.lock || true
          grep -A3 '^name = "sqlcipher-src"' Cargo.lock || true
          } 2>&1
      - name: Rust reads CLI fixture + creates DB + AES + namespace checks
        script: |
          set -e
          set -o pipefail
          {
          PASS=$(cat spike/out/fixture-passphrase.txt)
          BIN=spike/rust/target/release/cyclecare-spike
          $BIN verify spike/out/fixture-cli.db "$PASS"
          cp spike/out/fixture-authoritative.sql spike/out/fixture-for-rust.sql
          $BIN create spike/out/fixture-rust.db "$PASS" spike/out/fixture-for-rust.sql
          $BIN introspect spike/out/fixture-rust.db "$PASS"
          $BIN aes-verify Androidapp/app/build/spike/aesgcm-vectors-kotlin.txt Androidapp/app/build/spike/aesgcm-vectors-rust.txt
          for U in "11111111-2222-3333-4444-555555555555" "7c2dbf1b-0000-4000-8000-000000000000" "deadbeef-0000-4000-8000-000000000000"; do
            EXP="cycle_care_owner_$(printf %s "$U" | shasum -a 256 | cut -d' ' -f1)"
            $BIN namespace "$U" "$EXP"
          done
          } 2>&1 | tee build-logs/spike/rust-evidence.log
      - name: CLI reads Rust-created DB (reverse direction)
        script: |
          set -e
          set -o pipefail
          {
          PASS=$(cat spike/out/fixture-passphrase.txt)
          sqlcipher spike/out/fixture-rust.db "PRAGMA key = '$PASS';
          SELECT count(*) FROM cycle_day_logs;
          SELECT count(*) FROM health_sync_outbox;
          SELECT identity_hash FROM room_master_table;"
          } 2>&1 | tee build-logs/spike/cli-readback.log
      - name: AES-GCM vectors phase B (Kotlin verifies Rust)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          ./gradlew testDebugUnitTest \
            --tests "com.cyclecare.app.SpikeAesGcmVectorTest" \
            2>&1 | tee ../build-logs/spike/aes-phase-b.log
      - name: Rust Android target build (aarch64 cdylib via NDK)
        script: |
          set -e
          set -o pipefail
          {
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            echo "no side-by-side NDK; installing via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk-bundle" >/dev/null 2>&1 || true
            NDK=$(ls -d "$ANDROID_HOME"/ndk* "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "NDK=$NDK"; cat "$NDK/source.properties" | head -2
          TC="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cd spike/rust
          cargo build --release --target aarch64-linux-android 2>&1 | tee "$CM_BUILD_DIR/build-logs/spike/rust-android-build.log"
          SO=target/aarch64-linux-android/release/libcyclecare_spike.so
          file "$SO"
          "$TC/llvm-nm" -D "$SO" | grep cyclecare_spike_probe
          mkdir -p "$CM_BUILD_DIR/Androidapp/app/src/main/jniLibs/arm64-v8a"
          cp "$SO" "$CM_BUILD_DIR/Androidapp/app/src/main/jniLibs/arm64-v8a/"
          } 2>&1
      - name: Budget check before optional APK packaging
        script: |
          set -e
          SPENT=$(( $(date +%s) - $(cat build-logs/spike/start.ts) ))
          echo "spent ${SPENT}s of ${SPIKE_BUDGET_SECONDS}s"
          if [ "$SPENT" -gt "$SPIKE_BUDGET_SECONDS" ]; then
            echo "BUDGET_EXCEEDED: skipping optional APK packaging; .so build evidence already collected" | tee build-logs/spike/budget-skip.log
            exit 0
          fi
          echo "BUDGET_OK" | tee build-logs/spike/budget-ok.log
      - name: Package .so into slim APK (budget-gated) and verify
        script: |
          set -e
          set -o pipefail
          if [ ! -f build-logs/spike/budget-ok.log ]; then echo "skipped (budget)"; exit 0; fi
          cd Androidapp
          ./gradlew assembleSlim -PslimApk 2>&1 | tee ../build-logs/spike/assemble-with-so.log
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK"; ls -la "$APK"
          unzip -l "$APK" | grep "libcyclecare_spike.so" | tee ../build-logs/spike/apk-so-check.log
      - name: Spike summary
        script: |
          SPENT=$(( $(date +%s) - $(cat build-logs/spike/start.ts) ))
          echo "total spent ${SPENT}s" | tee -a build-logs/spike/timing.log
          ls -la spike/out build-logs/spike
    artifacts:
      - build-logs/spike/**/*
      - spike/out/**/*
      - Androidapp/app/build/outputs/apk/**/*.apk

  cyclecare-current-rust-diagnostic:
    name: CycleCare current native unsigned integration diagnostic
    max_build_duration: 45
    instance_type: mac_mini_m2
    inputs:
      expected_source_sha:
        description: Exact final candidate commit, supplied after commit creation
        default: ""
    environment:
      vars:
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.m2
    scripts:
      - name: Verify source and native input, forbid signing custody
        script: |
          set -euo pipefail
          mkdir -p build-logs
          test ! -e Androidapp/.private/cyclecare-debug.jks
          test ! -e Androidapp/my-upload-key.jks
          test -z "${CYCLECARE_DEBUG_KEYSTORE:-}"
          test -z "${CYCLECARE_DEBUG_STORE_PASSWORD:-}"
          test -z "${CYCLECARE_DEBUG_KEY_PASSWORD:-}"
          test -z "${KEYSTORE_PATH:-}"
          test -z "${STORE_PASSWORD:-}"
          test -z "${KEY_PASSWORD:-}"
          test -n "${EXPECTED_SOURCE_SHA:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD | tee build-logs/source-commit.txt
          git ls-files --error-unmatch Androidapp/rust/core-jni/jniLibs/arm64-v8a/libcyclecare_core.so
          python3 ci/verify-current-native.py input | tee build-logs/native-input.txt
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Prefetch Robolectric runtime jar (bounded, logged)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          VER="14-robolectric-10818077-i7"
          BASE="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/$VER"
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
          mkdir -p "$DEST"
          for f in "android-all-instrumented-$VER.jar" "android-all-instrumented-$VER.pom"; do
            if [ ! -s "$DEST/$f" ]; then
              echo "fetching $f"
              curl -fsSL --max-time 240 -o "$DEST/$f" "$BASE/$f"
            fi
            ls -la "$DEST/$f"
          done
          echo "prefetch complete"
          } 2>&1 | tee build-logs/robolectric-prefetch.log
      - name: Targeted unit tests
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew testDebugUnitTest \
            --tests "com.cyclecare.bridge.RustCoinAmountTest" \
            --tests "com.cyclecare.bridge.RustReconnectPolicyTest" \
            --tests "com.cyclecare.bridge.RustSetupChecksTest" \
            --tests "com.cyclecare.bridge.RustLogParserTest" \
            --tests "com.cyclecare.bridge.RustCyclePhaseTest" \
            --tests "com.cyclecare.bridge.RustEffectiveUserIdTest" \
            --tests "com.cyclecare.app.data.local.RoomBoundaryHostTest" \
            --tests "com.cyclecare.app.domain.ai.AiConsentTapDecisionTest" \
            --tests "com.cyclecare.app.data.notification.NotificationParsingTest" \
            --tests "com.cyclecare.app.domain.parser.NaturalLanguageLogParserTest" \
            --tests "com.cyclecare.app.domain.ai.LayeredChatOrchestratorTest" \
            --tests "com.cyclecare.app.ui.CoinAmountInputTest" \
            --tests "com.cyclecare.app.ui.SettingsPinTest" \
            --tests "com.cyclecare.app.ui.GuidedChatsRoomOpenTest" \
            --tests "com.cyclecare.app.AccountStartPolicyTest" \
            --tests "com.cyclecare.app.ReturningUserReopenTest" \
            --tests "com.cyclecare.app.ReopenSplashGateTest" \
            --tests "com.cyclecare.app.WalletStatusTest" \
            --tests "com.cyclecare.app.domain.ai.CareAiSourceContractTest" \
            2>&1 | tee ../build-logs/test-run.log
      - name: Build unsigned slim APK (arm64, minified)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          mkdir -p ../build-logs
          ./gradlew assembleSlim -PslimApk 2>&1 | tee ../build-logs/assemble-run.log
      - name: Verify packaged native bytes and unsigned APK
        script: |
          set -euo pipefail
          set +e
          python3 ci/verify-current-native.py apk > build-logs/packaged-native.txt 2>&1
          RC=$?
          cat build-logs/packaged-native.txt
          printf '%s\n' "$RC" > build-logs/verification-exit-code.txt
          if [ "$RC" -eq 0 ]; then
            printf '%s\n' 'ACCEPTED_PACKAGING_DIAGNOSTIC_ONLY' > build-logs/ACCEPTANCE.txt
          else
            printf '%s\n' 'NOT_ACCEPTED: verifier failed; artifact must not be delivered' > build-logs/ACCEPTANCE.txt
          fi
          cat build-logs/ACCEPTANCE.txt
          exit 0
    artifacts:
      - Androidapp/app/build/outputs/apk/**/*.apk
      - Androidapp/app/build/test-results/testDebugUnitTest/*.xml
      - build-logs/*
      - Androidapp/app/build/outputs/mapping/slim/*
  # The lab APKs are the Firebase Test Lab input. The device-side invocation
  # MUST target ONLY the lab suite (the assembled test APK also contains the
  # shared androidTest classes, which must not run on Test Lab):
  #   testTargets: ["class com.cyclecare.app.RustLabInstrumentedTest"]
  #   (gcloud equivalent: gcloud firebase test android run --type instrumentation
  #    --app app-lab.apk --test app-lab-androidTest.apk
  #    --test-targets "class com.cyclecare.app.RustLabInstrumentedTest")
  cyclecare-rust-lab-build:
    name: CycleCare Rust lab APK build (disposable, Test Lab input)
    max_build_duration: 30
    instance_type: mac_mini_m2
    inputs:
      expected_source_sha:
        description: Exact final candidate commit, supplied after commit creation
        default: ""
    environment:
      vars:
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Verify source pin and forbid signing custody
        script: |
          set -euo pipefail
          mkdir -p build-logs
          test ! -e Androidapp/.private/cyclecare-debug.jks
          test ! -e Androidapp/my-upload-key.jks
          test -z "${CYCLECARE_DEBUG_KEYSTORE:-}"
          test -z "${CYCLECARE_DEBUG_STORE_PASSWORD:-}"
          test -z "${CYCLECARE_DEBUG_KEY_PASSWORD:-}"
          test -z "${KEYSTORE_PATH:-}"
          test -z "${STORE_PASSWORD:-}"
          test -z "${KEY_PASSWORD:-}"
          test -n "${EXPECTED_SOURCE_SHA:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD | tee build-logs/source-commit.txt
          git ls-files --error-unmatch Androidapp/rust/core-jni/jniLibs/arm64-v8a/libcyclecare_core.so
          python3 ci/verify-current-native.py input | tee build-logs/native-input.txt
      - name: Build lab app + instrumented test APKs (arm64, minified)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          # Fail fast on source-set configuration mistakes before assembling/R8.
          ./gradlew :app:dependencies --configuration androidTestDebugImplementation \
            2>&1 | tee ../build-logs/lab-config-preflight.log
          ./gradlew -Pcyclecare.testBuildType=lab -PslimApk \
            assembleLab assembleLabAndroidTest 2>&1 | tee ../build-logs/lab-build.log \
            || { rc=$?; \
                 for f in app/build/outputs/mapping/lab*/missing_rules.txt; do \
                   [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }; \
                 done; exit $rc; }
      - name: Verify lab APKs (native bytes, DEX JNI, ephemeral debug cert)
        script: |
          set -euo pipefail
          APK_DIR=Androidapp/app/build/outputs/apk/lab APK_SIGNED=1 \
            python3 ci/verify-current-native.py apk | tee build-logs/lab-packaged-native.txt
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          test -x "$BT/apksigner" && test -x "$BT/aapt2"
          # Discover actual APK paths from the build output; no hardcoded
          # AGP output layout is assumed (layout differs across AGP versions).
          LABAPK=$(find Androidapp/app/build/outputs -name '*.apk' ! -name '*androidTest*' | tee build-logs/lab-find.txt)
          TESTAPK=$(find Androidapp/app/build/outputs -name '*androidTest*.apk' | tee -a build-logs/lab-find.txt)
          test "$(printf '%s\n' "$LABAPK" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$TESTAPK" | grep -c .)" -eq 1
          echo "lab apk: $LABAPK"; echo "test apk: $TESTAPK"
          sha256sum "$LABAPK" "$TESTAPK" | tee build-logs/lab-apk-sha256.txt
          # Deterministic publish directory for both APKs.
          rm -rf lab-artifacts && mkdir -p lab-artifacts
          cp "$LABAPK" lab-artifacts/app-arm64-v8a-lab.apk
          cp "$TESTAPK" lab-artifacts/app-arm64-v8a-lab-androidTest.apk
          : > build-logs/lab-signing.txt
          for A in lab-artifacts/app-arm64-v8a-lab.apk lab-artifacts/app-arm64-v8a-lab-androidTest.apk; do
            "$BT/apksigner" verify --print-certs "$A" | tee -a build-logs/lab-signing.txt
          done
          # Both APKs must carry the ephemeral Android Debug cert...
          test "$(grep -c 'CN=Android Debug' build-logs/lab-signing.txt)" -eq 2
          # ...and it must be the SAME signer certificate on both.
          test "$(grep 'certificate SHA-256 digest' build-logs/lab-signing.txt | sort -u | wc -l)" -eq 1
          # App package identity, fail-closed.
          "$BT/aapt2" dump badging lab-artifacts/app-arm64-v8a-lab.apk | grep -E "package: name='com.cyclecare.app.lab'" | tee build-logs/lab-package.txt
          # minSdk from the binary manifest (xmltree format is stable across
          # build-tools; badging renamed sdkVersion -> minSdkVersion in 36.x).
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml lab-artifacts/app-arm64-v8a-lab.apk \
            | tee build-logs/lab-app-manifest.xmltree.txt > /dev/null
          grep -qE 'android:minSdkVersion\(0x[0-9a-f]+\)=24' build-logs/lab-app-manifest.xmltree.txt
          # Test APK: package + instrumentation target/runner from the actual
          # binary manifest (aapt2 xmltree), fail-closed. Attribute format
          # verified against aapt2 34.0.0 xmltree output.
          "$BT/aapt2" dump badging lab-artifacts/app-arm64-v8a-lab-androidTest.apk | grep '^package: name=' | tee build-logs/lab-test-package.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml lab-artifacts/app-arm64-v8a-lab-androidTest.apk \
            | tee build-logs/lab-test-manifest.xmltree.txt > /dev/null
          INSTRBLOCK=$(awk '/E: instrumentation \(/{match($0,/^ */);ind=RLENGTH;f=1;print;next} f{match($0,/^ */);if($0 ~ /E: / && RLENGTH<=ind)exit;print}' build-logs/lab-test-manifest.xmltree.txt)
          test -n "$INSTRBLOCK"
          echo "$INSTRBLOCK" | tee build-logs/lab-instrumentation.txt
          echo "$INSTRBLOCK" | grep -qE 'android:name\(0x[0-9a-f]+\)="androidx\.test\.runner\.AndroidJUnitRunner"'
          echo "$INSTRBLOCK" | grep -qE 'android:targetPackage\(0x[0-9a-f]+\)="com\.cyclecare\.app\.lab"'
      - name: DEX closure preflight (gates any Test Lab matrix submission)
        script: |
          set -euo pipefail
          ANDROID_JAR=$(ls -d "$ANDROID_HOME/platforms/"*/ | sort -V | tail -1)android.jar
          test -s "$ANDROID_JAR"
          # Fail-closed: the matrix may only be submitted when this exits 0.
          # Proves runner + lab test + kept lab entry point are defined and
          # every test-APK type reference resolves to test APK, app APK, or
          # the platform (android.jar), minus an exact-name reviewed allowlist.
          # Historical flat closure result retained verbatim and separately.
          # Flat type-only closure cannot check j$ member/hierarchy collisions.
          # Preserve its exact report/exit; strict current closure below remains mandatory.
          set +e
          python3 ci/lab-dex-closure.py             lab-artifacts/app-arm64-v8a-lab.apk             lab-artifacts/app-arm64-v8a-lab-androidTest.apk             "$ANDROID_JAR" | tee build-logs/lab-dex-closure.txt
          FLAT_RC=${PIPESTATUS[0]}
          set -e
          echo "$FLAT_RC" > build-logs/lab-historical-flat-exit.txt
          # Parser versions pinned for canonical scanner and exact reviewer gate.
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.4' 'loguru==0.7.3'
          python3 ci/lab-device-static-closure.py lab-artifacts/app-arm64-v8a-lab.apk lab-artifacts/app-arm64-v8a-lab-androidTest.apk "$ANDROID_JAR" | tee build-logs/lab-current-type-closure.txt
          # Non-j$ executable reachability/member review remains a separate
          # mandatory pre-device check. Diagnostic flat type gaps are not waived
          # by this workflow. No matrix submission occurs in this workflow.
          # Mandatory controls and current-pair root equality. Regeneration writes
          # an artifact, NEVER overwrites the reviewed input used by L8.
          python3 ci/test-l8-union-roots.py | tee build-logs/lab-root-fixtures.txt
          python3 ci/lab-l8-union-roots.py lab-artifacts/app-arm64-v8a-lab.apk lab-artifacts/app-arm64-v8a-lab-androidTest.apk --write build-logs/lab-l8-regenerated-roots.pro
          python3 ci/lab-l8-union-roots.py lab-artifacts/app-arm64-v8a-lab.apk lab-artifacts/app-arm64-v8a-lab-androidTest.apk --check Androidapp/app/lab-l8-union-roots.pro | tee build-logs/lab-l8-root-equality.json
          # Exact reviewer gate, no allowlist or waived violations.
          python3 ci/j8-both-order-gate.py lab-artifacts/app-arm64-v8a-lab.apk lab-artifacts/app-arm64-v8a-lab-androidTest.apk --json build-logs/lab-both-order.json | tee build-logs/lab-both-order.txt
          echo 'L8_STATIC_GATES=PASS; device requires independent executable reachability review; not ART acceptance' | tee build-logs/lab-l8-static-gates.txt
      - name: Check R8 obfuscation active and caller path kept (bounded)
        script: |
          set -euo pipefail
          MAP=Androidapp/app/build/outputs/mapping/lab/mapping.txt
          test -s "$MAP"
          grep -q 'com.cyclecare.app.rust.CycleCareCoreBridge' "$MAP"
          grep -q 'com.cyclecare.app.lab.RustLabSelfCheck' "$MAP"
          # Obfuscation must be active: some mapping line must rename a class.
          grep -Eq '^com\.cyclecare\.app\..+ -> [a-z]+:' "$MAP"
          echo "mapping present; bridge + lab caller kept; obfuscation active" | tee build-logs/lab-mapping.txt
    artifacts:
      - lab-artifacts/*.apk
      - Androidapp/app/build/outputs/mapping/lab/mapping.txt
      - build-logs/*
