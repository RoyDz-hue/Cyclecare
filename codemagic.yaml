workflows:
  cyclecare-slim:
    name: CycleCare slim APK + targeted unit tests
    max_build_duration: 90
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.m2
    scripts:
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Prefetch Robolectric runtime jar (bounded, logged)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          VER="14-robolectric-10818077-i7"
          BASE="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/$VER"
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
          mkdir -p "$DEST"
          for f in "android-all-instrumented-$VER.jar" "android-all-instrumented-$VER.pom"; do
            if [ ! -s "$DEST/$f" ]; then
              echo "fetching $f"
              curl -fsSL --max-time 240 -o "$DEST/$f" "$BASE/$f"
            fi
            ls -la "$DEST/$f"
          done
          echo "prefetch complete"
          } 2>&1 | tee build-logs/robolectric-prefetch.log
      - name: Targeted unit tests
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew testDebugUnitTest \
            --tests "com.cyclecare.app.domain.ai.AiConsentTapDecisionTest" \
            --tests "com.cyclecare.app.data.notification.NotificationParsingTest" \
            --tests "com.cyclecare.app.domain.parser.NaturalLanguageLogParserTest" \
            --tests "com.cyclecare.app.domain.ai.LayeredChatOrchestratorTest" \
            --tests "com.cyclecare.app.ui.CoinAmountInputTest" \
            --tests "com.cyclecare.app.ui.SettingsPinTest" \
            --tests "com.cyclecare.app.ui.GuidedChatsRoomOpenTest" \
            --tests "com.cyclecare.app.AccountStartPolicyTest" \
            --tests "com.cyclecare.app.ReturningUserReopenTest" \
            --tests "com.cyclecare.app.ReopenSplashGateTest" \
            --tests "com.cyclecare.app.WalletStatusTest" \
            --tests "com.cyclecare.app.domain.ai.CareAiSourceContractTest" \
            2>&1 | tee ../build-logs/test-run.log
      - name: Build unsigned slim APK (arm64, minified)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          mkdir -p ../build-logs
          ./gradlew assembleSlim -PslimApk 2>&1 | tee ../build-logs/assemble-run.log
    artifacts:
      - Androidapp/app/build/outputs/apk/**/*.apk
      - Androidapp/app/build/test-results/testDebugUnitTest/*.xml
      - build-logs/*.log
  cyclecare-goldens:
    name: CycleCare golden refresh (Paparazzi, JDK21)
    max_build_duration: 60
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Record stale goldens after the page-canvas rework
        script: |
          set -e
          cd Androidapp
          chmod +x gradlew
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
          "$JAVA_HOME/bin/java" -version
          for f in "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" "$HOME/.gradle/gradle.properties"; do
            if [ -f "$f" ]; then
              echo "java keys in $f:"
              grep -E '^[[:space:]]*(org\.gradle\.java\.home|org\.gradle\.java\.installations\.[a-z-]+|org\.gradle\.jvm\.version|java\.home)' "$f" || echo "(none)"
            else
              echo "(no $f)"
            fi
          done
          mkdir -p ../build-logs
          set -o pipefail
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" recordPaparazziDebug -Ppaparazzi \
            --tests "com.cyclecare.app.ui.ScreensScreenshotTest" \
            --tests "com.cyclecare.app.ui.ShellFrameScreenshotTest" \
            --tests "com.cyclecare.app.ui.HomeFrameScreenshotTest" \
            --tests "com.cyclecare.app.ui.CompactShellScreenshotTest" \
            --tests "com.cyclecare.app.ui.SettingsScreenshotTest" \
            --tests "com.cyclecare.app.ui.DarkModeContrastScreenshotTest" \
            --tests "com.cyclecare.app.ui.OnboardingContrastScreenshotTest" \
            --tests "com.cyclecare.app.ui.CareConsentScreenshotTest" \
            --tests "com.cyclecare.app.ui.WalletStatusScreenshotTest" 2>&1 | tee ../build-logs/goldens-record.log
      - name: Capture expanded consent details (interactive, Robolectric)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew testDebugUnitTest --tests "com.cyclecare.app.ui.CareConsentExpandedCaptureTest" 2>&1 | tee ../build-logs/consent-capture.log
          cp app/build/test-results/testDebugUnitTest/*.xml ../build-logs/ 2>/dev/null || true
    artifacts:
      - Androidapp/app/src/test/snapshots/images/*.png
      - Androidapp/app/build/outputs/captures/*.png
      - build-logs/*.log
  cyclecare-device-verify:
    name: CycleCare emulator inset verification (real window insets)
    max_build_duration: 35
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $ANDROID_HOME/system-images
    scripts:
      - name: Build debug app and instrumented test APKs
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee ../build-logs/device-verify-build.log
      - name: Inspect installed Android SDK images (bounded)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          echo "== system-images dir =="
          ls -R "$ANDROID_HOME/system-images" 2>/dev/null || echo "(none installed)"
          echo "== sdkmanager installed =="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -i "system-images" || echo "(sdkmanager lists none)"
          } 2>&1 | tee build-logs/sdk-inventory.log
      - name: Ensure a usable system image (bounded 10 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          IMG=$(ls "$ANDROID_HOME/system-images" 2>/dev/null | grep -E '^android-[0-9]+$' | sort -t- -k2 -n | tail -1 || true)
          if [ -n "$IMG" ]; then
            VARIANT=$(ls "$ANDROID_HOME/system-images/$IMG" | grep -E 'google_apis|default' | head -1)
            ABI=$(ls "$ANDROID_HOME/system-images/$IMG/$VARIANT" | grep -E 'arm64|x86_64' | head -1)
            echo "reusing installed image: system-images;$IMG;$VARIANT;$ABI"
            echo "system-images;$IMG;$VARIANT;$ABI" > build-logs/avd-image.txt
          else
            echo "no installed image; installing system-images;android-36;google_apis;arm64-v8a (bounded)"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-36;google_apis;arm64-v8a" < /dev/null &
            IPID=$!
            for i in $(seq 1 120); do kill -0 $IPID 2>/dev/null || break; sleep 5; done
            if kill -0 $IPID 2>/dev/null; then
              kill $IPID 2>/dev/null
              echo "UNSUPPORTED: system image install exceeded 10 minutes on this runner"
              exit 1
            fi
            wait $IPID
            echo "system-images;android-36;google_apis;arm64-v8a" > build-logs/avd-image.txt
          fi
          cat build-logs/avd-image.txt
          } 2>&1 | tee build-logs/ensure-image.log
      - name: Create AVD and boot emulator (bounded 10 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          IMAGE=$(cat build-logs/avd-image.txt)
          echo "using image: $IMAGE"
          AVDMGR="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMU="$ANDROID_HOME/emulator/emulator"
          echo no | "$AVDMGR" create avd -n ccverify -k "$IMAGE" -d pixel_6 --force \
            || echo no | "$AVDMGR" create avd -n ccverify -k "$IMAGE" -d pixel --force
          "$EMU" -avd ccverify -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save > build-logs/emulator-console.log 2>&1 &
          adb wait-for-device
          BOOTED=""
          for i in $(seq 1 110); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOTED" = "1" ] && break
            sleep 5
          done
          echo "boot_completed=$BOOTED"
          [ "$BOOTED" = "1" ]
          adb shell wm size && adb shell wm density
          } 2>&1 | tee build-logs/emulator-step.log
      - name: Run production inset screenshot tests (bounded 8 min)
        script: |
          set -e
          set -o pipefail
          mkdir -p build-logs
          {
          adb install -r Androidapp/app/build/outputs/apk/debug/app-debug.apk
          adb install -r Androidapp/app/build/outputs/androidTest/apk/debug/app-debug-androidTest.apk
          adb shell am instrument -w \
            -e class com.cyclecare.app.DeviceInsetsScreenshotTest \
            com.cyclecare.app.debug.test/androidx.test.runner.AndroidJUnitRunner > build-logs/instrumentation.log 2>&1 &
          JPID=$!
          for i in $(seq 1 96); do kill -0 $JPID 2>/dev/null || break; sleep 5; done
          if kill -0 $JPID 2>/dev/null; then
            kill $JPID 2>/dev/null
            echo "instrumentation exceeded 8 minutes"
            cat build-logs/instrumentation.log || true
            exit 1
          fi
          wait $JPID; RC=$?
          cat build-logs/instrumentation.log
          [ $RC -eq 0 ]
          } 2>&1 | tee build-logs/instrument-step.log
      - name: Collect screenshots
        script: |
          mkdir -p device-verify
          adb pull /sdcard/Android/data/com.cyclecare.app.debug/files/. device-verify/ || true
          ls -la device-verify/ || true
          adb shell emu kill || true
    artifacts:
      - device-verify/*.png
      - build-logs/*.log
  cyclecare-release-r8-unsigned:
    name: CycleCare release R8 + resource shrink qualification (unsigned, task-only)
    max_build_duration: 30
    instance_type: mac_mini_m2
    inputs:
      expected_source_sha:
        description: Exact final candidate commit, supplied after commit creation
        default: ""
    environment:
      vars:
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.m2
    scripts:
      - name: Verify pinned source and forbid signing custody
        script: |
          set -euo pipefail
          mkdir -p build-logs
          test ! -e Androidapp/.private/cyclecare-debug.jks
          test ! -e Androidapp/my-upload-key.jks
          test -z "${CYCLECARE_DEBUG_KEYSTORE:-}"
          test -z "${CYCLECARE_DEBUG_STORE_PASSWORD:-}"
          test -z "${CYCLECARE_DEBUG_KEY_PASSWORD:-}"
          test -z "${KEYSTORE_PATH:-}"
          test -z "${STORE_PASSWORD:-}"
          test -z "${KEY_PASSWORD:-}"
          test -n "${EXPECTED_SOURCE_SHA:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD | tee build-logs/source-commit.txt
      - name: Explicit toolchain setup (JDK21, from cyclecare-goldens)
        script: |
          set -e
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
          "$JAVA_HOME/bin/java" -version
          test -d "$ANDROID_HOME/platforms/android-36.1" || { echo "MISSING android-36.1 platform (compileSdk 36 minorApiLevel 1); installed:"; ls "$ANDROID_HOME/platforms"; exit 1; }
      - name: SDK inventory (informational only, not a setup check)
        script: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -E "build-tools|platforms;android" || true
      - name: Release R8 minification + resource optimization (real tasks, unsigned)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
          mkdir -p ../build-logs
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" \
            minifyReleaseWithR8 optimizeReleaseResources \
            2>&1 | tee ../build-logs/release-r8-run.log
      - name: Bridge class and JNI methods kept (validated parser v3.1)
        script: |
          set -e
          MAP=Androidapp/app/build/outputs/mapping/release/mapping.txt
          test -s "$MAP"
          grep -Fx 'com.cyclecare.app.rust.CycleCareCoreBridge -> com.cyclecare.app.rust.CycleCareCoreBridge:' "$MAP"
          awk '/^com\.cyclecare\.app\.rust\.CycleCareCoreBridge -> com\.cyclecare\.app\.rust\.CycleCareCoreBridge:$/{b=1;next} /^#/{next} /^[^[:blank:]].* -> [^[:blank:]]+$/{if(b) exit} b&&/^[[:blank:]]/' "$MAP" > build-logs/bridge-mapping-block.txt
          grep -E '^[[:blank:]]+([0-9]+:[0-9]+:)?int nativeCoreHandshake\(\)(:[0-9]+(:[0-9]+)?)? -> nativeCoreHandshake$' build-logs/bridge-mapping-block.txt
          grep -E '^[[:blank:]]+([0-9]+:[0-9]+:)?java\.lang\.String nativeCall\(java\.lang\.String,java\.lang\.String\)(:[0-9]+(:[0-9]+)?)? -> nativeCall$' build-logs/bridge-mapping-block.txt
      - name: Obfuscation positive control (file-gated, no pipe mask)
        script: |
          set -e
          MAP=Androidapp/app/build/outputs/mapping/release/mapping.txt
          awk -F' -> ' '/^com\.cyclecare\.app\..* -> /{rhs=$2; sub(/:$/,"",rhs); if (rhs !~ /^com\.cyclecare\./) print}' "$MAP" > build-logs/obfuscation-control.txt
          test -s build-logs/obfuscation-control.txt
          head -5 build-logs/obfuscation-control.txt
      - name: optimizeReleaseResources output present (release-anchored, AGP 9.1.1 contract)
        script: |
          set -e
          OUT=$(find Androidapp/app/build/intermediates/optimized_processed_res/release -type f -name 'optimize.ap_' -size +0c -print)
          test "$(printf '%s\n' "$OUT" | grep -c .)" -eq 1
          ls -la "$OUT" | tee build-logs/shrink-output-evidence.txt
          shasum -a 256 "$OUT" >> build-logs/shrink-output-evidence.txt
          grep -F '> Task :app:optimizeReleaseResources' build-logs/release-r8-run.log
          grep -F 'BUILD SUCCESSFUL' build-logs/release-r8-run.log
      - name: 'Guard: no package/sign task substitution'
        script: |
          set -e
          ! grep -E '> Task :app:(packageRelease|signRelease|assembleRelease|bundleRelease)' build-logs/release-r8-run.log
    artifacts:
      - Androidapp/app/build/outputs/mapping/release/mapping.txt
      - Androidapp/app/build/outputs/mapping/release/seeds.txt
      - Androidapp/app/build/outputs/mapping/release/usage.txt
      - Androidapp/app/build/intermediates/optimized_processed_res/**/optimize.ap_
      - build-logs/*.log
      - build-logs/*.txt
  cyclecare-stage-f-instrumented-build:
    name: Stage-F instrumented-test build + inventory (PROPOSED; evidence build, not for merge; no device/runtime)
    max_build_duration: 30
    instance_type: mac_mini_m2
    inputs:
      expected_source_sha:
        description: Exact throwaway-branch tip commit, supplied after push at manual build start
        default: ""
    environment:
      vars:
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        NDK_PIN: "28.2.13676358"
        RUST_PIN: "1.99.1"
        ORCHESTRATOR_PIN: "1.6.1"
        TEST_SERVICES_PIN: "1.6.0"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.cargo/registry
    scripts:
      - name: Pin evidence context (fail closed; assertions before any repo writes)
        script: |
          set -euo pipefail
          PRELOG="$HOME/stage-f-preflight.log"
          {
          test -n "${EXPECTED_SOURCE_SHA:-}" || { echo "EXPECTED_SOURCE_SHA input empty - supply the exact branch tip SHA at build start"; exit 1; }
          HEADSHA=$(git rev-parse HEAD)
          echo "expected: ${EXPECTED_SOURCE_SHA}"
          echo "actual:   $HEADSHA"
          test "$HEADSHA" = "$EXPECTED_SOURCE_SHA" || { echo "SHA MISMATCH"; exit 1; }
          BASE="b6dfd24aad02a7a6a5a16f9c82a3364726bab27c"
          git cat-file -e "${BASE}^{commit}" || { echo "base commit ${BASE} missing from clone"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "DIRTY TREE:"; git status --porcelain; exit 1; }
          git diff --name-status "$BASE" "$HEADSHA" | LC_ALL=C sort > /tmp/stage-f-actual-name-status.txt
          diff stage-e-evidence/expected-name-status.txt /tmp/stage-f-actual-name-status.txt || { echo "DIFF SCOPE MISMATCH (allowed: stage-d 31 + stage-e 7 + stage-f reviewed set only)"; exit 1; }
          echo "--- Stage-D manifest content pin (repinned for 3 reviewed files) ---"
          echo "STAGEDMANIFESTHASH  stage-d-test-evidence/expected-sha256.txt" | shasum -a 256 -c -
          echo "--- Stage-D verifier attestation (pinned bytes of verify_test_xml.py) ---"
          echo "81ef926c12e35df852656bc67a58687d174416acb30d22cdfaaedaf81ee13841  stage-d-test-evidence/verify_test_xml.py" | shasum -a 256 -c -
          echo "--- Stage-E path-set + manifest (repinned build.gradle.kts only) ---"
          echo "9bbb4160d4fbbf4418757e1712ca71f42cd8aa0efd2781ad1c2518a47fcab6bc  stage-e-evidence/expected-manifest-paths.txt" | shasum -a 256 -c -
          awk '{print $2}' stage-e-evidence/expected-sha256.txt | LC_ALL=C sort > /tmp/stage-e-manifest-paths.txt
          diff stage-e-evidence/expected-manifest-paths.txt /tmp/stage-e-manifest-paths.txt || { echo "STAGE-E MANIFEST PATH SET MISMATCH"; exit 1; }
          shasum -a 256 -c stage-e-evidence/expected-sha256.txt
          echo "--- Stage-F manifest: exact path set, then hashes (4 reviewed androidTest sources) ---"
          echo "STAGEFPATHSHASH  stage-f-evidence/expected-manifest-paths.txt" | shasum -a 256 -c -
          awk '{print $2}' stage-f-evidence/expected-sha256.txt | LC_ALL=C sort > /tmp/stage-f-manifest-paths.txt
          diff stage-f-evidence/expected-manifest-paths.txt /tmp/stage-f-manifest-paths.txt || { echo "STAGE-F MANIFEST PATH SET MISMATCH"; exit 1; }
          shasum -a 256 -c stage-f-evidence/expected-sha256.txt
          echo "PIN OK"
          } 2>&1 | tee "$PRELOG"
          mkdir -p build-logs && cp "$PRELOG" build-logs/pin.log
      - name: JDK 17 pin (explicit binary; exact version assert, not ambient java)
        script: |
          set -euo pipefail
          {
          /usr/libexec/java_home -V 2>&1 || true
          JH=$(/usr/libexec/java_home -v 17) || { echo "NO JDK 17 ON RUNNER"; exit 1; }
          export JAVA_HOME="$JH"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java" || { echo "selected JAVA_HOME has no java binary"; exit 1; }
          JV=$("$JAVA_HOME/bin/java" -version 2>&1)
          echo "$JV"
          grep -q '"17\.' <<< "$JV" || { echo "selected java binary is NOT version 17"; exit 1; }
          } 2>&1 | tee build-logs/jdk-precheck.log
      - name: SDK platform + NDK pin inventory (documented image, no installs)
        script: |
          set -euo pipefail
          {
          ls /usr/local/share/android-sdk/platforms/ || { echo "NO SDK PLATFORMS ON RUNNER"; exit 1; }
          test -d /usr/local/share/android-sdk/platforms/android-36.1 || { echo "compileSdk 36 minor 1 platform (android-36.1, documented image spec) ABSENT - image drifted"; exit 1; }
          ls /usr/local/share/android-sdk/ndk/ || { echo "NO NDK DIR ON RUNNER"; exit 1; }
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          test -d "$ANDROID_NDK_HOME" || { echo "PINNED NDK ${NDK_PIN} ABSENT - image drifted from documented spec"; exit 1; }
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf" || { echo "NDK darwin prebuilt tools missing"; exit 1; }
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip" || { echo "NDK llvm-strip missing (needed by strip-reproduction gate)"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf" --version | head -2
          } 2>&1 | tee build-logs/ndk-precheck.log
      - name: Pinned Rust toolchain install + Android target (checksum-verified, fail closed)
        script: |
          set -euo pipefail
          {
          RUSTUP_INIT_SHA256="63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f"
          INSTALLER="/tmp/rustup-init-aarch64-apple-darwin"
          curl -sSf --max-time 120 -o "$INSTALLER" "https://static.rust-lang.org/rustup/dist/aarch64-apple-darwin/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $INSTALLER" | shasum -a 256 -c - || { echo "RUSTUP-INIT CHECKSUM MISMATCH"; exit 1; }
          FOUT="$(file "$INSTALLER")"
          grep -q "Mach-O 64-bit" <<< "$FOUT" || { echo "RUSTUP-INIT NOT MACH-O"; exit 1; }
          grep -q "arm64" <<< "$FOUT" || { echo "RUSTUP-INIT NOT ARM64"; exit 1; }
          chmod +x "$INSTALLER"
          "$INSTALLER" -y --no-modify-path --profile minimal --default-toolchain "$RUST_PIN"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android --toolchain "$RUST_PIN"
          rustup show active-toolchain
          rustup target list --installed
          } 2>&1 | tee build-logs/rust-toolchain-install.log
      - name: Build Android ARM artifact from clean source (fresh provenance, fail closed)
        script: |
          set -euo pipefail
          {
          export PATH="$HOME/.cargo/bin:$PATH"
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          mkdir -p build-logs
          date +%s > build-logs/.gate-start
          rm -rf Androidapp/rust/core-ffi/target/aarch64-linux-android
          rm -rf Androidapp/rust/core-jni/jniLibs
          bash Androidapp/rust/build-android.sh aarch64-linux-android "$RUST_PIN"
          } 2>&1 | tee build-logs/rust-android-build.log
      - name: Artifact gate (ELF header, alignment, exports, freshness, hash)
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          bash Androidapp/rust/verify-android-artifact.sh aarch64-linux-android "$ANDROID_NDK_HOME" build-logs/android-so-sha256.txt
          cat build-logs/android-so-sha256.txt
          } 2>&1 | tee build-logs/artifact-gate.log
      - name: Runner-local Gradle heap (repo file untouched)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.daemon=false\n' > "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"
      - name: assembleDebug + assembleDebugAndroidTest (same tip; unsigned-by-us; runner auto debug keystore)
        script: |
          set -euo pipefail
          {
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          cd Androidapp
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
          cd ..
          test -f Androidapp/rust/core-jni/jniLibs/arm64-v8a/libcyclecare_core.so || { echo "packaged jniLibs artifact missing after packageRustCore"; exit 1; }
          LEFTOVER=$(find Androidapp/rust/core-jni/jniLibs -mindepth 1 ! -path '*arm64-v8a*' -print -quit)
          test -z "$LEFTOVER" || { echo "unexpected non-arm64-v8a entries in jniLibs:"; find Androidapp/rust/core-jni/jniLibs -mindepth 1; exit 1; }
          echo "jniLibs: only arm64-v8a present"
          } 2>&1 | tee build-logs/apk-build.log
      - name: APK composition gate (app APK: exactly one; final-ELF validation + provenance + DEX)
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          shopt -s nullglob
          APKS=(Androidapp/app/build/outputs/apk/debug/*.apk)
          shopt -u nullglob
          test "${#APKS[@]}" -eq 1 || { echo "expected exactly ONE debug APK, found ${#APKS[@]}"; exit 1; }
          echo "APK=${APKS[0]}"
          bash Androidapp/rust/verify-apk-rust-content.sh "${APKS[0]}" build-logs/android-so-sha256.txt "$ANDROID_NDK_HOME" build-logs/apk-sha256.txt
          cat build-logs/apk-sha256.txt
          } 2>&1 | tee build-logs/apk-gate.log
      - name: Test APK gate (exactly one; identity + core lib presence + hash)
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          shopt -s nullglob
          TAPKS=(Androidapp/app/build/outputs/apk/androidTest/debug/*.apk)
          shopt -u nullglob
          test "${#TAPKS[@]}" -eq 1 || { echo "expected exactly ONE androidTest APK, found ${#TAPKS[@]}"; ls -la Androidapp/app/build/outputs/apk/androidTest/debug/ 2>/dev/null || true; exit 1; }
          echo "TEST_APK=${TAPKS[0]}"
          python3 - "${TAPKS[0]}" << 'PYGATE'
          import zipfile, hashlib, sys
          p = sys.argv[1]
          z = zipfile.ZipFile(p)
          names = z.namelist()
          print("entries:", len(names))
          # Test APK must NOT package the production core lib (instrumentation
          # loads it from the APP APK); flag if present so the fact is recorded.
          core = [n for n in names if n.endswith('libcyclecare_core.so')]
          print("core lib entries in test APK:", core)
          h = hashlib.sha256(open(p,'rb').read()).hexdigest()
          open('build-logs/test-apk-sha256.txt','w').write(f"{h}  {p}  bytes={len(open(p,'rb').read())}\n")
          print(h)
          PYGATE
          cat build-logs/test-apk-sha256.txt
          } 2>&1 | tee build-logs/test-apk-gate.log
      - name: Dependency resolution inventory (orchestrator + test-services exact pins resolved)
        script: |
          set -euo pipefail
          {
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          cd Androidapp
          ./gradlew :app:dependencies --configuration debugAndroidTestRuntimeClasspath --no-daemon > /tmp/deps.txt 2>&1 || { cat /tmp/deps.txt; exit 1; }
          cd ..
          grep -E "androidx.test:orchestrator|androidx.test.services:test-services" /tmp/deps.txt || { echo "orchestrator/test-services NOT in resolved graph"; exit 1; }
          grep -q "androidx.test:orchestrator:${ORCHESTRATOR_PIN}" /tmp/deps.txt || { echo "orchestrator resolved version != ${ORCHESTRATOR_PIN}"; grep "orchestrator" /tmp/deps.txt; exit 1; }
          grep -q "androidx.test.services:test-services:${TEST_SERVICES_PIN}" /tmp/deps.txt || { echo "test-services resolved version != ${TEST_SERVICES_PIN}"; grep "test-services" /tmp/deps.txt; exit 1; }
          cp /tmp/deps.txt build-logs/dependency-resolution.txt
          echo "RESOLVED orchestrator=${ORCHESTRATOR_PIN} test-services=${TEST_SERVICES_PIN}"
          } 2>&1 | tee build-logs/dependency-resolution.log
      - name: Generated Room output inventory (actual generator products compiled, hashed)
        script: |
          set -euo pipefail
          {
          GEN=$(find Androidapp/app/build/generated -name 'V9FixtureAnchorDatabase_Impl*' -o -name 'CycleCareDatabase_Impl*' 2>/dev/null | LC_ALL=C sort)
          test -n "$GEN" || { echo "NO generated Room impl files found - KSP output missing"; find Androidapp/app/build/generated -maxdepth 3 -type d | head -20; exit 1; }
          echo "$GEN"
          echo "$GEN" | tr ' ' '\n' | while read -r f; do shasum -a 256 "$f"; done
          echo "$GEN" | tr ' ' '\n' | while read -r f; do shasum -a 256 "$f"; done > build-logs/room-generated-sha256.txt
          } 2>&1 | tee build-logs/room-generated.log
      - name: Exact 10-test identity inventory (DEX class/method evidence)
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          DEXDUMP=$(ls /usr/local/share/android-sdk/build-tools/*/dexdump | head -1)
          test -x "$DEXDUMP" || { echo "dexdump missing"; exit 1; }
          TAPK=$(echo Androidapp/app/build/outputs/apk/androidTest/debug/*.apk)
          "$DEXDUMP" "$TAPK" > /tmp/testdex.txt 2>/dev/null || { echo "dexdump failed"; exit 1; }
          for M in \
            'Lcom/cyclecare/app/data/local/EncryptedDatabaseInstrumentedTest;' \
            'Lcom/cyclecare/app/data/local/V9FixtureAnchorDatabase;' \
            'Lcom/cyclecare/app/data/local/V9FixtureProcessRestartInstrumentedTest;' \
            'Lcom/cyclecare/app/rust/NativeCoreInstrumentedTest;' ; do
            grep -q "Class definition.*$M\|Class descriptor.*$M" /tmp/testdex.txt || { echo "MISSING test class $M"; exit 1; }
            echo "OK: $M"
          done
          for M in \
            encryptedRoundTripThroughProductionFactory \
            wrongPassphraseIsRefusedAndFileUnharmed \
            durableReopenAfterCloseWithStoredWrappedPassphrase \
            storedFileIsNotPlaintextSqlite \
            testKeyMaterialIsSyntheticAndStableWithinRun \
            nativeLibraryLoadsOnDevice \
            devicePageSizeIs16384 \
            warmUpAndPlannedRoundtripValidates \
            a_seedEncryptedV9Fixture \
            b_verifyUpgradeAcrossProcessRestart ; do
            grep -q "$M" /tmp/testdex.txt || { echo "MISSING test method $M"; exit 1; }
          done
          echo "EXACT 10 TEST IDENTITIES PRESENT"
          } 2>&1 | tee build-logs/test-inventory.log
      - name: Merged manifest inventory (app + test: providers, initializers, permissions, packages, certs)
        script: |
          set -euo pipefail
          {
          APPMAN=$(find Androidapp/app/build/intermediates/merged_manifest* Androidapp/app/build/intermediates/packaged_manifests 2>/dev/null -path '*debug*' -name AndroidManifest.xml ! -path '*androidTest*' | head -1)
          TESTMAN=$(find Androidapp/app/build/intermediates/merged_manifest* Androidapp/app/build/intermediates/packaged_manifests 2>/dev/null -path '*androidTest*' -name AndroidManifest.xml | head -1)
          test -n "$APPMAN" || { echo "app merged manifest not found"; find Androidapp/app/build/intermediates -maxdepth 2 -type d -name '*manifest*'; exit 1; }
          test -n "$TESTMAN" || { echo "test merged manifest not found"; find Androidapp/app/build/intermediates -maxdepth 2 -type d -name '*manifest*'; exit 1; }
          cp "$APPMAN" build-logs/merged-manifest-app.xml
          cp "$TESTMAN" build-logs/merged-manifest-test.xml
          shasum -a 256 build-logs/merged-manifest-app.xml build-logs/merged-manifest-test.xml | tee build-logs/merged-manifest-sha256.txt
          echo "--- app manifest: package + providers + initializers + permissions ---"
          grep -o 'package="[^"]*"' build-logs/merged-manifest-app.xml | head -1
          grep -o 'android:name="[^"]*Initializer"' build-logs/merged-manifest-app.xml || true
          grep -o 'android:name="[^"]*Provider"' build-logs/merged-manifest-app.xml || true
          grep -c 'uses-permission' build-logs/merged-manifest-app.xml || true
          echo "--- test manifest: package + targetPackage + instrumentation ---"
          grep -o 'package="[^"]*"' build-logs/merged-manifest-test.xml | head -1
          grep -o 'targetPackage="[^"]*"' build-logs/merged-manifest-test.xml || true
          grep -o 'android:name="[^"]*"' build-logs/merged-manifest-test.xml | grep -i 'orchestrator\|runner\|services' || true
          AAPT=$(ls /usr/local/share/android-sdk/build-tools/*/aapt2 | head -1)
          APK=$(echo Androidapp/app/build/outputs/apk/debug/*.apk)
          TAPK=$(echo Androidapp/app/build/outputs/apk/androidTest/debug/*.apk)
          "$AAPT" dump badging "$APK" | head -3
          "$AAPT" dump badging "$TAPK" | head -3
          } 2>&1 | tee build-logs/merged-manifest-inventory.log
      - name: APK cert evidence (runner auto debug keystore; both APKs)
        script: |
          set -euo pipefail
          {
          APKSIGNER=$(ls /usr/local/share/android-sdk/build-tools/*/apksigner | head -1)
          test -x "$APKSIGNER" || { echo "apksigner missing"; exit 1; }
          APK=$(echo Androidapp/app/build/outputs/apk/debug/*.apk)
          TAPK=$(echo Androidapp/app/build/outputs/apk/androidTest/debug/*.apk)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$TAPK"
          } 2>&1 | tee build-logs/apk-certs.log
    artifacts:
      - build-logs/*.log
      - build-logs/*.txt
      - build-logs/merged-manifest-*.xml
      - Androidapp/app/build/outputs/apk/debug/*.apk
      - Androidapp/app/build/outputs/apk/androidTest/debug/*.apk
  cyclecare-stage-f-instrumented-build:
    name: Stage-F instrumented-test build + inventory (PROPOSED; evidence build, not for merge; no device/runtime)
    max_build_duration: 30
    instance_type: mac_mini_m2
    inputs:
      expected_source_sha:
        description: Exact throwaway-branch tip commit, supplied after push at manual build start
        default: ""
    environment:
      vars:
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        NDK_PIN: "28.2.13676358"
        RUST_PIN: "1.99.1"
        ORCHESTRATOR_PIN: "1.6.1"
        TEST_SERVICES_PIN: "1.6.0"
        RUNNER_PIN: "1.6.2"
        JUNIT4_PIN: "4.13.2"
        EXT_JUNIT_PIN: "1.3.0"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.cargo/registry
    scripts:
      - name: Pin evidence context (fail closed; assertions before any repo writes)
        script: |
          set -euo pipefail
          PRELOG="$HOME/stage-f-preflight.log"
          {
          test -n "${EXPECTED_SOURCE_SHA:-}" || { echo "EXPECTED_SOURCE_SHA input empty - supply the exact branch tip SHA at build start"; exit 1; }
          HEADSHA=$(git rev-parse HEAD)
          echo "expected: ${EXPECTED_SOURCE_SHA}"
          echo "actual:   $HEADSHA"
          test "$HEADSHA" = "$EXPECTED_SOURCE_SHA" || { echo "SHA MISMATCH"; exit 1; }
          BASE="b6dfd24aad02a7a6a5a16f9c82a3364726bab27c"
          git cat-file -e "${BASE}^{commit}" || { echo "base commit ${BASE} missing from clone"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "DIRTY TREE:"; git status --porcelain; exit 1; }
          git diff --name-status "$BASE" "$HEADSHA" | LC_ALL=C sort > /tmp/stage-f-actual-name-status.txt
          diff stage-e-evidence/expected-name-status.txt /tmp/stage-f-actual-name-status.txt || { echo "DIFF SCOPE MISMATCH (allowed: stage-d 31 + stage-e 7 + stage-f reviewed set only)"; exit 1; }
          echo "--- Stage-D: manifest content pin, then ALL entry hashes, verifier attestation separate ---"
          echo "STAGEDMANIFESTHASH  stage-d-test-evidence/expected-sha256.txt" | shasum -a 256 -c -
          shasum -a 256 -c stage-d-test-evidence/expected-sha256.txt
          echo "81ef926c12e35df852656bc67a58687d174416acb30d22cdfaaedaf81ee13841  stage-d-test-evidence/verify_test_xml.py" | shasum -a 256 -c -
          echo "--- Stage-E: manifest content pin, path-set pin, path diff, entry hashes ---"
          echo "653f1cd84eb8187721d18ce6c17a222cbeca841a82ad52e33d2e86c177b685a3  stage-e-evidence/expected-sha256.txt" | shasum -a 256 -c -
          echo "9bbb4160d4fbbf4418757e1712ca71f42cd8aa0efd2781ad1c2518a47fcab6bc  stage-e-evidence/expected-manifest-paths.txt" | shasum -a 256 -c -
          awk '{print $2}' stage-e-evidence/expected-sha256.txt | LC_ALL=C sort > /tmp/stage-e-manifest-paths.txt
          diff stage-e-evidence/expected-manifest-paths.txt /tmp/stage-e-manifest-paths.txt || { echo "STAGE-E MANIFEST PATH SET MISMATCH"; exit 1; }
          shasum -a 256 -c stage-e-evidence/expected-sha256.txt
          echo "--- Stage-F: manifest content pin, path-set pin, path diff, entry hashes (4 androidTest + DatabaseKeyManager + 2 gate scripts + test inventory) ---"
          echo "STAGEFMANIFESTHASH  stage-f-evidence/expected-sha256.txt" | shasum -a 256 -c -
          echo "STAGEFPATHSHASH  stage-f-evidence/expected-manifest-paths.txt" | shasum -a 256 -c -
          awk '{print $2}' stage-f-evidence/expected-sha256.txt | LC_ALL=C sort > /tmp/stage-f-manifest-paths.txt
          diff stage-f-evidence/expected-manifest-paths.txt /tmp/stage-f-manifest-paths.txt || { echo "STAGE-F MANIFEST PATH SET MISMATCH"; exit 1; }
          shasum -a 256 -c stage-f-evidence/expected-sha256.txt
          echo "PIN OK"
          } 2>&1 | tee "$PRELOG"
          mkdir -p build-logs && cp "$PRELOG" build-logs/pin.log
      - name: JDK 17 pin (explicit binary; exact version assert, not ambient java)
        script: |
          set -euo pipefail
          {
          /usr/libexec/java_home -V 2>&1 || true
          JH=$(/usr/libexec/java_home -v 17) || { echo "NO JDK 17 ON RUNNER"; exit 1; }
          export JAVA_HOME="$JH"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java" || { echo "selected JAVA_HOME has no java binary"; exit 1; }
          "$JAVA_HOME/bin/java" -version > /tmp/jversion.txt 2>&1
          cat /tmp/jversion.txt
          grep -q '"17\.' /tmp/jversion.txt || { echo "selected java binary is NOT version 17"; exit 1; }
          } 2>&1 | tee build-logs/jdk-precheck.log
      - name: SDK platform + NDK pin inventory (documented image, no installs)
        script: |
          set -euo pipefail
          {
          ls /usr/local/share/android-sdk/platforms/ || { echo "NO SDK PLATFORMS ON RUNNER"; exit 1; }
          test -d /usr/local/share/android-sdk/platforms/android-36.1 || { echo "compileSdk 36 minor 1 platform (android-36.1, documented image spec) ABSENT - image drifted"; exit 1; }
          ls /usr/local/share/android-sdk/ndk/ || { echo "NO NDK DIR ON RUNNER"; exit 1; }
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          test -d "$ANDROID_NDK_HOME" || { echo "PINNED NDK ${NDK_PIN} ABSENT - image drifted from documented spec"; exit 1; }
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf" || { echo "NDK darwin prebuilt tools missing"; exit 1; }
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip" || { echo "NDK llvm-strip missing (needed by strip-reproduction gate)"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readelf" --version > /tmp/readelf-version.txt 2>&1
          sed -n '1,2p' /tmp/readelf-version.txt
          } 2>&1 | tee build-logs/ndk-precheck.log
      - name: Pinned Rust toolchain install + Android target (checksum-verified, fail closed)
        script: |
          set -euo pipefail
          {
          RUSTUP_INIT_SHA256="63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f"
          INSTALLER="/tmp/rustup-init-aarch64-apple-darwin"
          curl -sSf --max-time 120 -o "$INSTALLER" "https://static.rust-lang.org/rustup/dist/aarch64-apple-darwin/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $INSTALLER" | shasum -a 256 -c - || { echo "RUSTUP-INIT CHECKSUM MISMATCH"; exit 1; }
          FOUT="$(file "$INSTALLER")"
          grep -q "Mach-O 64-bit" <<< "$FOUT" || { echo "RUSTUP-INIT NOT MACH-O"; exit 1; }
          grep -q "arm64" <<< "$FOUT" || { echo "RUSTUP-INIT NOT ARM64"; exit 1; }
          chmod +x "$INSTALLER"
          "$INSTALLER" -y --no-modify-path --profile minimal --default-toolchain "$RUST_PIN"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android --toolchain "$RUST_PIN"
          rustup show active-toolchain
          rustup target list --installed
          } 2>&1 | tee build-logs/rust-toolchain-install.log
      - name: Build Android ARM artifact from clean source (fresh provenance, fail closed)
        script: |
          set -euo pipefail
          {
          export PATH="$HOME/.cargo/bin:$PATH"
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          mkdir -p build-logs
          date +%s > build-logs/.gate-start
          rm -rf Androidapp/rust/core-ffi/target/aarch64-linux-android
          rm -rf Androidapp/rust/core-jni/jniLibs
          bash Androidapp/rust/build-android.sh aarch64-linux-android "$RUST_PIN"
          } 2>&1 | tee build-logs/rust-android-build.log
      - name: Artifact gate (ELF header, alignment, exports, freshness, hash)
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          bash Androidapp/rust/verify-android-artifact.sh aarch64-linux-android "$ANDROID_NDK_HOME" build-logs/android-so-sha256.txt
          cat build-logs/android-so-sha256.txt
          } 2>&1 | tee build-logs/artifact-gate.log
      - name: Runner-local Gradle heap (repo file untouched)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.daemon=false\n' > "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"
      - name: assembleDebug + assembleDebugAndroidTest (same tip; unsigned-by-us; runner auto debug keystore)
        script: |
          set -euo pipefail
          {
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          cd Androidapp
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
          cd ..
          test -f Androidapp/rust/core-jni/jniLibs/arm64-v8a/libcyclecare_core.so || { echo "packaged jniLibs artifact missing after packageRustCore"; exit 1; }
          LEFTOVER=$(find Androidapp/rust/core-jni/jniLibs -mindepth 1 ! -path '*arm64-v8a*' -print -quit)
          test -z "$LEFTOVER" || { echo "unexpected non-arm64-v8a entries in jniLibs:"; find Androidapp/rust/core-jni/jniLibs -mindepth 1; exit 1; }
          echo "jniLibs: only arm64-v8a present"
          } 2>&1 | tee build-logs/apk-build.log
      - name: 'APK composition gate (app APK: exactly one; final-ELF validation + provenance + DEX)'
        script: |
          set -euo pipefail
          {
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/${NDK_PIN}"
          shopt -s nullglob
          APKS=(Androidapp/app/build/outputs/apk/debug/*.apk)
          shopt -u nullglob
          test "${#APKS[@]}" -eq 1 || { echo "expected exactly ONE debug APK, found ${#APKS[@]}"; exit 1; }
          echo "APK=${APKS[0]}"
          bash Androidapp/rust/verify-apk-rust-content.sh "${APKS[0]}" build-logs/android-so-sha256.txt "$ANDROID_NDK_HOME" build-logs/apk-sha256.txt
          cat build-logs/apk-sha256.txt
          } 2>&1 | tee build-logs/apk-gate.log
      - name: 'Test APK gate (exactly one; core lib ABSENT fail-closed; embedded orchestrator APK exact)'
        script: |
          set -euo pipefail
          {
          shopt -s nullglob
          TAPKS=(Androidapp/app/build/outputs/apk/androidTest/debug/*.apk)
          shopt -u nullglob
          test "${#TAPKS[@]}" -eq 1 || { echo "expected exactly ONE androidTest APK, found ${#TAPKS[@]}"; exit 1; }
          TAPK="${TAPKS[0]}"
          echo "TEST_APK=$TAPK"
          unzip -l "$TAPK" > build-logs/test-apk-filelist.txt
          if grep -q 'libcyclecare_core' build-logs/test-apk-filelist.txt; then echo "TEST APK MUST NOT package the core lib (instrumentation loads it from the APP APK)"; exit 1; fi
          echo "core lib absent from test APK: OK"
          mapfile -t EMB < <(awk '$NF ~ /\.apk$/ {print $NF}' build-logs/test-apk-filelist.txt | LC_ALL=C sort)
          test "${#EMB[@]}" -eq 1 || { echo "expected exactly ONE embedded androidTestUtil APK (orchestrator), found ${#EMB[@]}:"; printf '%s\n' "${EMB[@]:-none}"; exit 1; }
          echo "embedded util APK entry: ${EMB[0]}"
          rm -rf /tmp/embedded-util && mkdir -p /tmp/embedded-util
          unzip -o -j "$TAPK" "${EMB[0]}" -d /tmp/embedded-util > /dev/null
          cp "/tmp/embedded-util/$(basename "${EMB[0]}")" build-logs/embedded-orchestrator.apk
          shasum -a 256 build-logs/embedded-orchestrator.apk | tee build-logs/embedded-orchestrator-sha256.txt
          mapfile -t BT < <(compgen -G '/usr/local/share/android-sdk/build-tools/*/aapt2' | LC_ALL=C sort)
