workflows:
  cyclecare-compile-check:
    name: CycleCare Kotlin main+test compilation check (compile-only; no Rust ABI/JNI validation, no migration delivery)
    max_build_duration: 12
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: JDK 17 pin (explicit binary; exact version assert, not ambient java)
        script: |
          set -euo pipefail
          mkdir -p build-logs
          {
          /usr/libexec/java_home -V 2>&1 || true
          JH=$(/usr/libexec/java_home -v 17) || { echo "NO JDK 17 ON RUNNER"; exit 1; }
          export JAVA_HOME="$JH"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java" || { echo "selected JAVA_HOME has no java binary"; exit 1; }
          JV=$("$JAVA_HOME/bin/java" -version 2>&1)
          echo "$JV"
          grep -q '"17\.' <<< "$JV" || { echo "selected java binary is NOT version 17"; exit 1; }
          } 2>&1 | tee build-logs/jdk-precheck.log
      - name: Route org.robolectric via Google-hosted Maven Central mirror
        script: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/cyclecare-robolectric-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = 'GoogleCloudStorageMavenCentralMirror'
                              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                          }
                      }
                      filter { includeGroup('org.robolectric') }
                  }
              }
          }
          GRADLE
      - name: Compile Kotlin main and unit-test sources (no test execution, no packaging)
        script: |
          set -e
          set -o pipefail
          cd Androidapp
          chmod +x gradlew
          mkdir -p ../build-logs
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --console=plain 2>&1 | tee ../build-logs/compile-check.log
    artifacts:
      - build-logs/*.log
